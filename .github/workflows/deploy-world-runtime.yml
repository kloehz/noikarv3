name: Deploy World Runtime

on:
  push:
    branches: [main]
    paths-ignore:
      - backend/**
      - docs/**
      - openspec/**
      - tests/**
      - .github/workflows/deploy-backend.yml
      - DEPLOYMENT.md
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noikar-world-runtime-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot editor and export templates
        run: |
          set -euo pipefail
          godot_version=4.7-stable
          curl --fail --location --silent --show-error \
            --output godot.zip \
            "https://github.com/godotengine/godot/releases/download/$godot_version/Godot_v${godot_version}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v${godot_version}_linux.x86_64
          curl --fail --location --silent --show-error \
            --output templates.tpz \
            "https://github.com/godotengine/godot/releases/download/$godot_version/Godot_v${godot_version}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.stable"
          templates_dir="$HOME/.local/share/godot/export_templates/4.7.stable"
          unzip -q templates.tpz -d "$templates_dir"
          # The official .tpz nests everything under a top-level "templates/"
          # folder; Godot expects the binaries directly inside 4.7.stable/.
          if [ -d "$templates_dir/templates" ]; then
            mv "$templates_dir/templates/"* "$templates_dir/"
            rmdir "$templates_dir/templates"
          fi
          test -f "$templates_dir/linux_release.x86_64"
      - name: Prepare filtered server project
        run: |
          set -euo pipefail
          SERVER_PROJECT="$RUNNER_TEMP/noikar-server-project"
          rm -rf "$SERVER_PROJECT"
          mkdir -p "$SERVER_PROJECT"
          # Filter sources before Godot scans the project; export exclude
          # filters only affect packaging and cannot prevent editor import work.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.godot/' \
            --exclude='build/' \
            --exclude='assets/models/' \
            --exclude='MODELS_TEST/' \
            --exclude='scenes/characters/' \
            --exclude='addons/gut/' \
            --exclude='tests/' \
            ./ "$SERVER_PROJECT/"
          test -f "$SERVER_PROJECT/project.godot"
          test -f "$SERVER_PROJECT/export_presets.cfg"
          if find "$SERVER_PROJECT" -name '*.glb' -print -quit | grep -q .; then
            echo "Filtered server project must not contain GLB files." >&2
            exit 1
          fi
          printf 'SERVER_PROJECT=%s\n' "$SERVER_PROJECT" >> "$GITHUB_ENV"
      - name: Export dedicated server
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/world"
          world_exe="$GITHUB_WORKSPACE/build/world/noikar-server.x86_64"
          ./Godot_v4.7-stable_linux.x86_64 --headless \
            --path "$SERVER_PROJECT" \
            --export-release "Dedicated Server (Linux)" "$world_exe"
          test -x "$world_exe"
      - uses: actions/upload-artifact@v4
        with:
          name: noikar-world-runtime
          path: build/world/
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_DEPLOY_PATH: ${{ vars.NOIKAR_VPS_PATH }}
      RELEASE_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: noikar-world-runtime
          path: build/world
      - name: Restore executable bit lost by artifact upload
        run: chmod +x build/world/noikar-server.x86_64
      - name: Validate deployment configuration
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_DEPLOY_PATH"
          case "$VPS_DEPLOY_PATH" in /*) ;; *) exit 1 ;; esac
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      - name: Pin VPS host key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Sync dedicated-server runtime
        run: |
          set -euo pipefail
          # The VPS edge firewall intermittently drops runner traffic before
          # it reaches sshd, so every remote operation retries with backoff.
          retry() {
            local attempts=8 delay=20 n=1
            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then return 1; fi
              echo "attempt $n failed; retrying in ${delay}s..."
              sleep "$delay"
              n=$((n + 1))
            done
          }
          export SSHOPTS="-o ConnectTimeout=15"
          release_dir="$VPS_DEPLOY_PATH/world/releases/$RELEASE_VERSION"
          retry ssh $SSHOPTS "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$release_dir'"
          retry rsync -az --delete -e "ssh $SSHOPTS" build/world/ \
            "$VPS_USER@$VPS_HOST:$release_dir/"
          remote_env="VPS_DEPLOY_PATH='$VPS_DEPLOY_PATH'"
          remote_env="$remote_env RELEASE_VERSION='$RELEASE_VERSION'"
          retry ssh $SSHOPTS "$VPS_USER@$VPS_HOST" \
            "$remote_env bash -s" <<'REMOTE'
          set -euo pipefail
          world_dir="$VPS_DEPLOY_PATH/world"
          release_path="$world_dir/releases/$RELEASE_VERSION"
          ln -sfn "$release_path" "$world_dir/current.next"
          mv -Tf "$world_dir/current.next" "$world_dir/current"
          REMOTE
      - name: Verify dedicated-server runtime
        run: |
          set -euo pipefail
          for attempt in $(seq 1 8); do
            remote_world="$VPS_DEPLOY_PATH/world/current"
            verify_cmd="test -x '$remote_world/noikar-server.x86_64'"
            verify_cmd="$verify_cmd && test -f '$remote_world/noikar-server.pck'"
            if ssh -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" "$verify_cmd"; then
              exit 0
            fi
            echo "verify attempt $attempt failed; retrying in 20s..."
            sleep 20
          done
          exit 1
