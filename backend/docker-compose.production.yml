services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - noikar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Public bind: closed beta serves the API straight off the VPS IP.
      # Move back to 127.0.0.1 when an HTTPS reverse proxy fronts it.
      - "${API_PORT:-8090}:8080"

volumes:
  noikar_pgdata:
